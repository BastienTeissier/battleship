{% load django_vite %}
<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Battleship{% endblock %}</title>
    {% vite_hmr_client %}
    {% vite_asset 'assets/main.js' %}
  </head>
  <body class="h-full bg-gray-50 text-gray-900">
    <nav class="border-gray-200 bg-white">
      <div class="mx-auto flex max-w-screen-xl flex-wrap items-center justify-between p-4">
        <a href="/" class="flex items-center space-x-3">
          <span class="self-center whitespace-nowrap text-2xl font-semibold">Battleship</span>
        </a>
      </div>
    </nav>
    <main class="mx-auto max-w-screen-xl p-4">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
